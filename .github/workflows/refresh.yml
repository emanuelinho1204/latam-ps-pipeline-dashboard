name: Refresh Dashboard Data

on:
  schedule:
    # Runs every 2 hours Mon-Fri, 7am-9pm Mexico City time
    # Cron is UTC: covers 13:00-03:00 UTC (7am-9pm CST/CDT)
    - cron: '0 13,15,17,19,21,23,1,3 * * 1-5'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SF CLI
        run: npm install -g @salesforce/cli --quiet

      - name: Authenticate to org62
        env:
          ORG62_SFDX_URL: ${{ secrets.ORG62_SFDX_URL }}
        run: |
          echo "$ORG62_SFDX_URL" > /tmp/sfdxurl.txt
          sf org login sfdx-url --sfdx-url-file /tmp/sfdxurl.txt --alias org62 --no-prompt
          rm -f /tmp/sfdxurl.txt

      - name: Fetch fresh data and update index.html
        run: python3 refresh-data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "noreply@salesforce.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore: auto-refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
